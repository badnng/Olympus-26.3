name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Verify the tag and build release artifacts
    if: github.repository == 'badnng/Olympus-26.3'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a tag on the trusted main history
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B .github/scripts/release.py check --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"

      - name: Run the shared release build and regression suites
        uses: ./.github/actions/build-neoforge
        with:
          cache-read-only: 'true'

      - name: Collect artifacts and require the tag to match the mod version
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B .github/scripts/build_metadata.py collect --project-root . --output-dir "$RUNNER_TEMP/olympus-dist" --tag "$RELEASE_TAG"

      - name: Preserve the exact release artifact for publication or recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/olympus-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve test reports and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            common/build/reports/
            neoforge/build/reports/
            neoforge/runs/gametest/logs/
            neoforge/runs/gametest/crash-reports/
            neoforge/runs/client-test/logs/
            neoforge/runs/client-test/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Upload a complete draft, verify assets, then publish
    needs: build
    if: github.repository == 'badnng/Olympus-26.3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/olympus-dist

      - name: Verify and publish without overwriting published tags
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B .github/scripts/release.py publish --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --directory "$RUNNER_TEMP/olympus-dist"
