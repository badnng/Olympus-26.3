name: CI

on:
  push:
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Preserve every branch push; only superseded builds of the same PR are cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: NeoForge build and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the same release JAR used for tagged releases
        uses: ./.github/actions/build-neoforge
        with:
          cache-read-only: ${{ github.repository != 'badnng/Olympus-26.3' || github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Collect verified release JARs, checksums and build information
        id: package
        run: python3 -B .github/scripts/build_metadata.py collect --project-root . --output-dir "$RUNNER_TEMP/olympus-dist"

      - name: Upload JARs and build information
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/olympus-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve test reports and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            common/build/reports/
            neoforge/build/reports/
            neoforge/runs/gametest/logs/
            neoforge/runs/gametest/crash-reports/
            neoforge/runs/client-test/logs/
            neoforge/runs/client-test/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

  telegram:
    name: Send the verified JAR to Telegram
    needs: build
    if: >-
      vars.TELEGRAM_ENABLED == 'true' &&
      github.repository == 'badnng/Olympus-26.3' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      group: telegram-ci-channel
      cancel-in-progress: false
      queue: max
    env:
      TELEGRAM_BOT_API_COMMIT: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select hosted or local Bot API
        id: telegram-config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 -B .github/scripts/telegram_ci.py --check-config

      - name: Download the build job's original artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/olympus-dist

      - name: Restore the official Bot API executable
        id: bot-api-cache
        if: steps.telegram-config.outputs.api_mode == 'local'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: telegram-bot-api-ubuntu24.04-${{ runner.arch }}-${{ env.TELEGRAM_BOT_API_COMMIT }}-v1

      - name: Build the official Local Bot API server
        if: steps.telegram-config.outputs.api_mode == 'local' && steps.bot-api-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: bash .github/scripts/build_telegram_bot_api.sh

      - name: Cache only the official executable
        if: steps.telegram-config.outputs.api_mode == 'local' && steps.bot-api-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: ${{ steps.bot-api-cache.outputs.cache-primary-key }}

      - name: Send the JAR or the oversize download link
        timeout-minutes: 25
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_API_BINARY: ${{ runner.temp }}/telegram-bot-api-bin/telegram-bot-api
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        run: python3 -B .github/scripts/telegram_ci.py "$RUNNER_TEMP/olympus-dist"
